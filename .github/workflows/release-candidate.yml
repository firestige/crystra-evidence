name: Evidence release candidate

on:
  push:
    branches:
      - release/next

permissions:
  contents: read
  packages: write

concurrency:
  group: evidence-release-candidate
  cancel-in-progress: false

jobs:
  qualify-and-publish-prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact component source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: evidence-product
      - name: Verify release trigger event and ref
        run: evidence-product/release/cli/verify-trigger.sh
      - name: Resolve immutable release request and development Contract
        id: request
        working-directory: evidence-product
        run: |
          CANDIDATE_TAG="$(jq -er .candidate_tag release/request.json)"
          CONTRACT_REF="$(jq -er .revision config/development-contract.json)"
          CONTRACT_REPO="$(jq -er .repository config/development-contract.json)"
          echo "$CONTRACT_REF" | grep -Eq '^[0-9a-f]{40}$'
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "contract_ref=$CONTRACT_REF" >> "$GITHUB_OUTPUT"
          echo "contract_repo=$CONTRACT_REPO" >> "$GITHUB_OUTPUT"
      - name: Check out exact current Contract dependency
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.request.outputs.contract_repo }}
          ref: ${{ steps.request.outputs.contract_ref }}
          path: contracts
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
      - name: Verify current Evidence Query binding and conformance
        run: |
          npm --prefix contracts/evidence-query ci --ignore-scripts
          npm --prefix contracts/evidence-query test
          npm --prefix contracts/evidence-query run check
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: 0.11.28
          python-version: "3.14"

      - uses: docker/setup-buildx-action@v4

      - name: Verify candidate coordinate and resolve resumable RC state
        id: candidate
        working-directory: evidence-product
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          case "$CANDIDATE_TAG" in "crystra-evidence-v$VERSION"-rc.*) ;; *) exit 1 ;; esac
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" --jq .object.sha)" = "$RELEASE_TARGET"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" >/dev/null 2>&1; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$CANDIDATE_TAG" --jq .object.sha)" = "$RELEASE_TARGET"
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run acceptance gates
        working-directory: evidence-product
        run: make check && make integration && make deployment

      - name: Resolve or publish immutable candidate OCI image
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/firestige/crystra-evidence:$CANDIDATE_TAG"
          if docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' >/dev/null 2>&1; then
            docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' \
              | jq -er .digest > "$RUNNER_TEMP/oci-digest"
          else
            docker buildx build --push \
              --platform linux/amd64,linux/arm64 \
              --provenance=mode=max \
              --sbom=true \
              --tag "$IMAGE" \
              --build-arg "CRYSTRA_RELEASE_REVISION=$RELEASE_TARGET" \
              --metadata-file "$RUNNER_TEMP/image-metadata.json" \
              --file "$GITHUB_WORKSPACE/evidence-product/deployment/Dockerfile" \
              "$GITHUB_WORKSPACE/evidence-product"
            jq -er '.["containerimage.digest"]' "$RUNNER_TEMP/image-metadata.json" > "$RUNNER_TEMP/oci-digest"
          fi
          docker buildx imagetools inspect "ghcr.io/firestige/crystra-evidence@$(cat "$RUNNER_TEMP/oci-digest")" \
            --format '{{json .Manifest}}' > "$RUNNER_TEMP/qualified-image-manifest.json"
          docker buildx imagetools inspect "ghcr.io/firestige/crystra-evidence@$(cat "$RUNNER_TEMP/oci-digest")" \
            --format '{{json .Image}}' > "$RUNNER_TEMP/qualified-image-config.json"
          docker buildx imagetools inspect "ghcr.io/firestige/crystra-evidence@$(cat "$RUNNER_TEMP/oci-digest")" \
            --format '{{json .Provenance}}' > "$RUNNER_TEMP/qualified-image-provenance.json"
          jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] |
            (index("amd64") != null and index("arm64") != null)' \
            "$RUNNER_TEMP/qualified-image-manifest.json" >/dev/null
          python3 evidence-product/release/validate_image_qualification.py \
            --provenance "$RUNNER_TEMP/qualified-image-provenance.json" \
            --image-config "$RUNNER_TEMP/qualified-image-config.json" \
            --product-commit "$RELEASE_TARGET" >/dev/null

      - name: Build and verify exact immutable Python assets
        working-directory: evidence-product
        run: |
          git diff --exit-code HEAD
          uv run python -m release.cli.release build \
            "$RUNNER_TEMP/local-release" "$(cat "$RUNNER_TEMP/oci-digest")"
          VERSION="$(uv run python -m release.cli.release verify "$RUNNER_TEMP/local-release" | jq -er .version)"
          for NAME in "crystra_evidence-${VERSION}-py3-none-any.whl" "crystra_evidence-${VERSION}.tar.gz"; do
            test -s "$RUNNER_TEMP/local-release/$NAME"
          done

      - name: Mint short-lived release App token after candidate qualification
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CRYSTRA_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.CRYSTRA_RELEASE_APP_PRIVATE_KEY }}
          owner: firestige
          repositories: crystra-evidence
          permission-contents: write
          permission-workflows: write

      - name: Create or resume RC with exact local assets
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
          RC_EXISTS: ${{ steps.candidate.outputs.exists }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          if test "$RC_EXISTS" != true; then
            gh release create "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$RELEASE_TARGET"
          fi
          mkdir "$RUNNER_TEMP/existing-assets"
          for FILE in "$RUNNER_TEMP/local-release/"*; do
            NAME="$(basename "$FILE")"
            if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$NAME"; then
              gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir "$RUNNER_TEMP/existing-assets"
              cmp "$FILE" "$RUNNER_TEMP/existing-assets/$NAME"
            else
              gh release upload "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" "$FILE"
            fi
          done

      - name: Redownload and verify exact RC assets and OCI digest
        working-directory: evidence-product
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
        run: |
          mkdir "$RUNNER_TEMP/remote-release"
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/remote-release"
          uv run python -m release.cli.release verify "$RUNNER_TEMP/remote-release"
          cmp "$RUNNER_TEMP/local-release/release-metadata.json" "$RUNNER_TEMP/remote-release/release-metadata.json"
          OCI_DIGEST="$(jq -r .ociDigest "$RUNNER_TEMP/remote-release/release-metadata.json")"
          test "$OCI_DIGEST" = "$(cat "$RUNNER_TEMP/oci-digest")"
          docker pull "ghcr.io/firestige/crystra-evidence@$OCI_DIGEST"

      - name: Run deployment and backup-restore against remote-qualified state
        working-directory: evidence-product
        run: make deployment

      - name: Attach qualification evidence
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.candidate_tag }}
          PUBLISHER_REVISION: ${{ github.workflow_sha }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          export CANDIDATE_TAG PUBLISHER_REVISION RELEASE_TARGET
          uv run --directory evidence-product python -c 'import hashlib,json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); m=(p/"remote-release/release-metadata.json").read_bytes(); d=json.loads(m); q={"schemaVersion":"crystra.release-qualification@1.0.0","candidateTag":os.environ["CANDIDATE_TAG"],"commit":os.environ["RELEASE_TARGET"],"publisherRevision":os.environ["PUBLISHER_REVISION"],"contractRevision":"evidence.query@0.1.0","contractStatus":"CURRENT","artifactMetadataSha256":"sha256:"+hashlib.sha256(m).hexdigest(),"ociDigest":d["ociDigest"],"localAcceptance":{"status":"PASS"},"remoteQualification":{"status":"PASS"}}; (p/"release-qualification.json").write_text(json.dumps(q,indent=2)+"\n")'
          if gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq release-qualification.json; then
            mkdir "$RUNNER_TEMP/existing-qualification"
            gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --pattern release-qualification.json --dir "$RUNNER_TEMP/existing-qualification"
            cmp "$RUNNER_TEMP/release-qualification.json" "$RUNNER_TEMP/existing-qualification/release-qualification.json"
          else
            gh release upload "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" "$RUNNER_TEMP/release-qualification.json"
          fi
